[package]
name = "anibeam-dev-worker"
description = "The developer endpoints at dev.anibeam.app as a Cloudflare Worker"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/marcusbandit/Anibeam"
publish = false

# Its own workspace, so the repo's `cargo test --workspace` never builds this
# wasm-only crate.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
worker = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
