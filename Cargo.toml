[workspace]
resolver = "3"
members = [
    "crates/contract",
    "crates/foundation",
    "crates/net",
    "crates/library",
    "crates/releases",
    "crates/metadata",
    "crates/trackers",
    "crates/downloads",
    "crates/playback",
    "crates/host",
    "crates/core",
    "crates/recs",
    "crates/host-api",
    "crates/room",
    "apps/cli",
    "apps/desktop",
    "relay/server",
]

[workspace.package]
version = "2.6.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/marcusbandit/Anibeam"

[workspace.dependencies]
anibeam-contract = { path = "crates/contract" }
anibeam-core = { path = "crates/core" }
anibeam-downloads = { path = "crates/downloads" }
anibeam-foundation = { path = "crates/foundation" }
anibeam-host = { path = "crates/host" }
anibeam-host-api = { path = "crates/host-api" }
anibeam-library = { path = "crates/library" }
anibeam-metadata = { path = "crates/metadata" }
anibeam-net = { path = "crates/net" }
anibeam-playback = { path = "crates/playback" }
anibeam-recs = { path = "crates/recs" }
anibeam-releases = { path = "crates/releases" }
anibeam-room = { path = "crates/room" }
anibeam-trackers = { path = "crates/trackers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "process", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive"] }
# Pinned once: every crate that uses one must agree on it, or uniffi's derives and the
# core's export disagree, and two libsqlite3-sys cannot link into one build.
uniffi = "=0.32.0"
rusqlite = "0.40"
rusqlite_migration = "2.6"

[profile.release]
debug = 1

# A build to hand test on a machine (#927): the release build without debug info, into
# target/tester/, so the binary is small to copy. Built with the anibeam package's `dev-qml`
# feature it loads the QML from disk when ANIBEAM_QML_DIR is set, so a QML-only change needs no
# build at all. Never shipped.
[profile.tester]
inherits = "release"
debug = 0
