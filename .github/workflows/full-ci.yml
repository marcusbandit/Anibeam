name: Full CI

# Every platform's build and tests for a pull request, run once it works on Linux (#986). A push
# to a PR runs only the fast checks (ci.yml and the small ones); the Linux checks run locally
# with scripts/local-ci.sh. When the PR is ready, put the `full ci` label on it: this builds
# its head on Linux (AppImage and distro smoke tests), Windows, macOS, the Arch tarball and the
# iPhone IPA. A push while the label is on builds the new head again; take it off to push
# without a rebuild. The Android check runs on a push already (android.yml), and the signed
# APK stays with nightly.yml, so PR code never runs next to the phone's key. Nothing is
# published: the builds' files stay on the workflow run.
#
# A pull request that changes no app (only site/, docs/ or Markdown other than the two
# CHANGELOG.md files the apps compile in) builds nothing here (#1548): the gate says so and
# the no-app job stands in for the builds, so automerge still counts the run.
on:
  pull_request:
    types: [labeled, synchronize, reopened]

# A new push or the label landing again replaces the PR's running build. Any other label
# landing runs on its own, so it never cancels a build it has nothing to do with.
concurrency:
  group: >-
    ${{ github.event.action == 'labeled' && github.event.label.name != 'full ci'
    && format('full-ci-other-{0}', github.run_id) || format('full-ci-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The one job that always runs. scripts/ci/ios-automerge.sh counts a Full CI run as one that
  # built its commit when any job besides this one ran, so keep its name and keep every
  # other job behind it.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.files.outputs.build || steps.label.outputs.build }}
      no_app: ${{ steps.files.outputs.no_app || 'false' }}
    steps:
      - name: Label says build
        id: label
        env:
          ACTION: ${{ github.event.action }}
          CHANGED: ${{ github.event.label.name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'full ci') }}
        run: |
          build=false
          case "$ACTION" in
            labeled) [ "$CHANGED" = "full ci" ] && build=true ;;
            synchronize|reopened) [ "$LABELLED" = true ] && build=true ;;
          esac
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build=$build"

      - uses: actions/checkout@v4
        if: steps.label.outputs.build == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Whether the pull request touches any app at all (#1548), from the exact base and head
      # this run judges. --no-renames lists a moved file under both paths, so moving app code
      # into docs/ still counts as an app change.
      - name: Files say build
        id: files
        if: steps.label.outputs.build == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only --no-renames "$BASE...$HEAD")"
          app=false
          [ -z "$files" ] && app=true
          while IFS= read -r f; do
            case "$f" in
              "") ;;
              */CHANGELOG.md|CHANGELOG.md) app=true ;;
              site/*|docs/*|*.md|.github/workflows/site.yml) ;;
              *) app=true ;;
            esac
          done <<<"$files"
          if [ "$app" = true ]; then build=true; no_app=false; else build=false; no_app=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "no_app=$no_app" >> "$GITHUB_OUTPUT"
          echo "build=$build no_app=$no_app"

  # Stands in for the builds when the pull request changes no app, so scripts/ci/ios-automerge.sh
  # sees a run that did more than its gate and counts this head as checked.
  no-app:
    needs: gate
    if: needs.gate.outputs.no_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Only the website, docs or Markdown changed, so no app is built."

  linux:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/linux.yml
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  windows:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/windows.yml
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  macos:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/macos.yml
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  arch:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/arch.yml
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  ios:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/ios-ipa.yml
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.head.sha }}
